{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{.Title}}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Time Tracker</div>
    <nav>
      <a href="/dashboard" {{if eq .Page "dashboard"}}class="active"{{end}}>Dashboard</a>
      <a href="/docs" {{if eq .Page "docs"}}class="active"{{end}}>Docs</a>
      <a href="/reports" {{if eq .Page "reports"}}class="active"{{end}}>Reports</a>
      <a href="/rules" {{if eq .Page "rules"}}class="active"{{end}}>Rules</a>
      <a href="/suggestions" {{if eq .Page "suggestions"}}class="active"{{end}}>Suggestions</a>
      <a href="/projects" {{if eq .Page "projects"}}class="active"{{end}}>Projects</a>
      <a href="/integrations" {{if or (eq .Page "integrations") (eq .Page "integrations_tidsreg")}}class="active"{{end}}>Integrations</a>
      <a href="/settings" {{if eq .Page "settings"}}class="active"{{end}}>Settings</a>
    </nav>
  </header>
  <main class="shell">
    {{if .Flash}}<section class="flash">{{.Flash}}</section>{{end}}
    {{.BodyHTML}}
  </main>
  {{if eq .Page "docs"}}
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

    const prepareMermaidBlocks = () => {
      document.querySelectorAll("pre code.language-mermaid").forEach((code) => {
        const pre = code.parentElement;
        if (!pre) return;
        const diagram = document.createElement("pre");
        diagram.className = "mermaid";
        diagram.textContent = code.textContent || "";
        pre.replaceWith(diagram);
      });
    };

    prepareMermaidBlocks();
    mermaid.initialize({ startOnLoad: false });
    mermaid.run({ querySelector: ".mermaid" });
  </script>
  {{end}}
</body>
</html>
{{end}}
