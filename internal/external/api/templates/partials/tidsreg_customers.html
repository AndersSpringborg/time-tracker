{{define "partials/tidsreg_customers"}}
<div class="stack">
  <h3>Select Customers</h3>
  {{if .TidsregError}}<p class="flash">{{.TidsregError}}</p>{{end}}
  {{if .TidsregCustomers}}
    <form hx-post="/integrations/tidsreg/preview" hx-target="#tidsreg-flow" hx-swap="innerHTML">
      <table>
        <thead><tr><th>Include</th><th>Customer</th></tr></thead>
        <tbody>
        {{range .TidsregCustomers}}
          <tr>
            <td><input type="checkbox" name="customer_ids" value="{{.CustomerID}}"></td>
            <td>{{.Name}}</td>
          </tr>
        {{end}}
        </tbody>
      </table>
      <div class="actions">
        <button type="submit">Fetch Projects</button>
        <button type="button" hx-post="/integrations/tidsreg/session/clear" hx-target="#tidsreg-flow" hx-swap="innerHTML">Start Over</button>
      </div>
    </form>
  {{else}}
    <p class="muted">No customers returned by tidsreg for this account.</p>
    <button type="button" hx-post="/integrations/tidsreg/session/clear" hx-target="#tidsreg-flow" hx-swap="innerHTML">Back to Login</button>
  {{end}}
</div>
{{end}}
