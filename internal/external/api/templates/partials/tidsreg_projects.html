{{define "partials/tidsreg_projects"}}
<div class="space-y-4">
  <h3 class="text-lg font-semibold text-tt-ink">Step 2: Select Projects</h3>
  {{if .TidsregError}}
  <div class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{.TidsregError}}</div>
  {{end}}
  {{if .TidsregProjects}}
    <form hx-post="/integrations/tidsreg/preview" hx-target="#tidsreg-flow" hx-swap="innerHTML" hx-indicator="#tidsreg-loader">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-slate-200">
              <th class="py-2 text-left font-medium text-slate-600 w-10">Include</th>
              <th class="py-2 text-left font-medium text-slate-600">Customer</th>
              <th class="py-2 text-left font-medium text-slate-600">Project</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
          {{range .TidsregProjects}}
            <tr class="hover:bg-slate-50">
              <td class="py-2">
                <input type="checkbox" name="project_ids" value="{{.ProjectID}}" class="rounded border-slate-300 text-tt-accent focus:ring-tt-accent">
              </td>
              <td class="py-2 text-slate-600">{{.CustomerName}}</td>
              <td class="py-2 text-slate-800">{{.Name}}</td>
            </tr>
          {{end}}
          </tbody>
        </table>
      </div>
      <div class="mt-4 flex flex-wrap items-center gap-3">
        <button type="button" data-toggle-checkboxes data-checkbox-name="project_ids" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Select All / None</button>
        <button type="submit" class="rounded-lg bg-tt-accent px-4 py-2 text-sm font-semibold text-white hover:bg-teal-700">Load Step 3: Preview</button>
        <button type="button" hx-post="/integrations/tidsreg/session/clear" hx-target="#tidsreg-flow" hx-swap="innerHTML" hx-indicator="#tidsreg-loader" class="rounded-lg border border-red-300 bg-white px-3 py-2 text-sm font-medium text-red-700 hover:bg-red-50">Start Over</button>
      </div>
    </form>
  {{else}}
    <p class="text-sm text-slate-600">No projects found for selected customers.</p>
    <button type="button" hx-post="/integrations/tidsreg/session/clear" hx-target="#tidsreg-flow" hx-swap="innerHTML" hx-indicator="#tidsreg-loader" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Back to Login</button>
  {{end}}
</div>
{{end}}
