{{define "partials/tidsreg_projects"}}
<div class="stack">
  <h3>Step 2: Select Projects</h3>
  {{if .TidsregError}}<p class="flash">{{.TidsregError}}</p>{{end}}
  {{if .TidsregProjects}}
    <form hx-post="/integrations/tidsreg/preview" hx-target="#tidsreg-flow" hx-swap="innerHTML" hx-indicator="#tidsreg-loader">
      <table>
        <thead><tr><th>Include</th><th>Customer</th><th>Project</th></tr></thead>
        <tbody>
        {{range .TidsregProjects}}
          <tr>
            <td><input type="checkbox" name="project_ids" value="{{.ProjectID}}"></td>
            <td>{{.CustomerName}}</td>
            <td>{{.Name}}</td>
          </tr>
        {{end}}
        </tbody>
      </table>
      <div class="actions">
        <button type="button" data-toggle-checkboxes data-checkbox-name="project_ids">Check/Uncheck All</button>
        <button type="submit">Load Step 3: Preview</button>
        <button type="button" hx-post="/integrations/tidsreg/session/clear" hx-target="#tidsreg-flow" hx-swap="innerHTML" hx-indicator="#tidsreg-loader">Start Over</button>
      </div>
    </form>
  {{else}}
    <p class="muted">No projects found for selected customers.</p>
    <button type="button" hx-post="/integrations/tidsreg/session/clear" hx-target="#tidsreg-flow" hx-swap="innerHTML" hx-indicator="#tidsreg-loader">Back to Login</button>
  {{end}}
</div>
{{end}}
