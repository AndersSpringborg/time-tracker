{{define "integrations_tidsreg"}}
<section class="space-y-6">
  <header class="rounded-2xl border border-slate-200 bg-white/90 p-6 shadow-sm">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div>
        <h1 class="text-2xl font-semibold text-tt-ink">Tidsreg Import</h1>
        <p class="mt-1 max-w-2xl text-sm text-slate-600">Sign in, then follow three steps: customers, projects, and final import confirmation.</p>
      </div>
      <a href="/integrations" class="inline-flex items-center gap-1 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Back to Integrations
      </a>
    </div>
  </header>

  <div id="tidsreg-loader" class="htmx-indicator flex items-center gap-3 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3" aria-live="polite">
    <span class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-amber-300 border-t-amber-600" aria-hidden="true"></span>
    <span class="text-sm font-medium text-amber-700">Loading tidsreg data...</span>
  </div>

  <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <div id="tidsreg-flow">
      {{template "partials/tidsreg_login" .}}
    </div>
  </section>
</section>

<script>
(function () {
  if (window.__ttTidsregToggleAllInit) return;
  window.__ttTidsregToggleAllInit = true;
  document.addEventListener("click", function (event) {
    var btn = event.target.closest("[data-toggle-checkboxes]");
    if (!btn) return;
    var form = btn.closest("form");
    if (!form) return;
    var targetName = btn.getAttribute("data-checkbox-name");
    if (!targetName) return;
    var checkboxes = Array.prototype.filter.call(
      form.querySelectorAll('input[type="checkbox"]'),
      function (checkbox) { return checkbox.name === targetName; }
    );
    if (checkboxes.length === 0) return;
    var shouldCheck = checkboxes.some(function (checkbox) { return !checkbox.checked; });
    checkboxes.forEach(function (checkbox) { checkbox.checked = shouldCheck; });
  });
})();
</script>
{{end}}
