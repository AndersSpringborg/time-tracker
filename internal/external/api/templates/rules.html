{{define "rules"}}
<section class="space-y-6">
  <header class="rounded-2xl border border-slate-200 bg-white/90 p-6 shadow-sm">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div>
        <h1 class="text-2xl font-semibold text-tt-ink">Rules Draft</h1>
        <p class="mt-1 max-w-2xl text-sm text-slate-600">Stage changes, review the diff, then save in one transaction.</p>
      </div>
    </div>
  </header>
  <div id="rules-editor" hx-get="/partials/rules" hx-trigger="load" hx-swap="innerHTML">
    <div class="rounded-2xl border border-slate-200 bg-white p-5 text-sm text-slate-600">Loading rules editor...</div>
  </div>
</section>
{{end}}
