{{define "integrations"}}
<section class="space-y-6">
  <header class="rounded-2xl border border-slate-200 bg-white/90 p-6 shadow-sm">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div>
        <h1 class="text-2xl font-semibold text-tt-ink">Integrations</h1>
        <p class="mt-1 max-w-2xl text-sm text-slate-600">Connect external services to import projects and activities.</p>
      </div>
    </div>
  </header>

  <section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <div class="flex items-start justify-between gap-3">
        <div>
          <h3 class="text-lg font-semibold text-tt-ink">Tidsreg</h3>
          <p class="mt-1 text-sm text-slate-600">Import customers, projects, and activities from Tidsreg.</p>
        </div>
        <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-teal-100 text-teal-600">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
        </div>
      </div>
      <div class="mt-4">
        <a href="/integrations/tidsreg" class="inline-flex items-center gap-2 rounded-lg bg-tt-accent px-4 py-2 text-sm font-semibold text-white hover:bg-teal-700">
          Configure
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </a>
      </div>
    </article>
  </section>
</section>
{{end}}
