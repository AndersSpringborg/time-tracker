{{define "dashboard"}}
<section class="space-y-6">
  <header class="rounded-2xl border border-slate-200 bg-white/90 p-6 shadow-sm">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-semibold text-tt-ink">Dashboard</h1>
        <p class="mt-1 text-sm text-slate-600">Real-time tracking overview with auto-refresh every 15 seconds.</p>
      </div>
      <button
        class="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
        hx-get="/partials/dashboard"
        hx-target="#dashboard-panel"
        hx-swap="innerHTML"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Refresh
      </button>
    </div>
  </header>
  <section
    class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
    id="dashboard-panel"
    hx-get="/partials/dashboard"
    hx-trigger="load, every 15s"
    hx-swap="innerHTML"
  >
    <div class="text-sm text-slate-600">Loading dashboard...</div>
  </section>
</section>
{{end}}
