{{define "projects"}}
<section class="space-y-6">
  <header class="rounded-2xl border border-slate-200 bg-white/90 p-6 shadow-sm">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div>
        <h1 class="text-2xl font-semibold text-tt-ink">Projects and Activities</h1>
        <p class="mt-2 max-w-3xl text-sm text-slate-600">
          Events map to a composite target: <strong>Project + Activity</strong>. Use this page to keep projects organized, manage activity sets, and maintain clear mapping targets.
        </p>
      </div>
      <a class="inline-flex items-center rounded-lg bg-tt-accent px-3 py-2 text-sm font-semibold text-white hover:bg-teal-700" href="#project-create-card">Add Project</a>
    </div>
  </header>
  <section
    class="space-y-4"
    id="projects-panel"
    hx-get="/partials/projects"
    hx-trigger="load"
    hx-swap="innerHTML"
  >
    <div class="rounded-xl border border-slate-200 bg-white p-5 text-sm text-slate-600">Loading projects...</div>
  </section>
</section>
{{end}}
